name: Patch cluster hosts

# Self-hosted because GitHub-hosted runners cannot reach the Pis.
# Job specs deploy through reconcile.yml. This play dist-upgrades and reboots,
# so it does not run on push. Merge does not start it.

on:
  workflow_dispatch:
  schedule:
    - cron: "17 8 * * 1"

permissions:
  contents: read

concurrency:
  group: homelab-cluster
  cancel-in-progress: false

jobs:
  patch:
    runs-on: [self-hosted, homelab]
    env:
      # The runner has no stored host keys for the Pis.
      ANSIBLE_HOST_KEY_CHECKING: "false"
      # The readiness check runs on the runner, not on a Nomad agent.
      NOMAD_ADDR: http://192.168.68.65:4646
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch Nomad hosts
        run: |
          set -euo pipefail
          runner="$(hostname -s)"
          echo "::notice::infra patch runner ${runner} user $(id -un)"
          case "$runner" in
            pinode2|pinode3|pinode4)
              echo "::error::infra patch runner is ${runner}, a Nomad client; draining it would kill this job"
              exit 1
              ;;
          esac
          if ! command -v ansible-playbook >/dev/null 2>&1; then
            sudo DEBIAN_FRONTEND=noninteractive apt-get update
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y ansible
          fi
          for host in pinode1 pinode2 pinode3 pinode4; do
            if ! ssh -o BatchMode=yes -o ConnectTimeout=10 "dan@${host}.local" true; then
              echo "::error::ssh to dan@${host}.local failed"
              exit 1
            fi
          done
          cd bootstrap/nomad
          mkdir -p /tmp/homelab-patch-results
          find /tmp/homelab-patch-results -mindepth 1 -delete
          ansible-playbook -i ../inventory.yml -e "patch_runner_host=${runner}" playbooks/patch_cluster.yml
          # One line per host. The Actions log store is not readable from outside the LAN.
          for host in pinode1 pinode2 pinode3 pinode4; do
            result="/tmp/homelab-patch-results/${host}.txt"
            if [[ ! -f "$result" ]]; then
              echo "::error::no patch result for ${host}"
              exit 1
            fi
            line="$(tr -d '\n' <"$result")"
            echo "::notice::${line}"
          done
          # The Actions log store is not readable from outside the LAN.
          nomad node status -no-color | while IFS= read -r line; do
            [[ -z "$line" ]] && continue
            echo "::notice::${line}"
          done
          if nomad node status -no-color | awk 'NR>1 && $NF != "ready" { bad = 1 } END { exit bad+0 }'; then
            echo "::notice::all nomad nodes ready"
          else
            echo "::error::a nomad node is not ready after patch"
            exit 1
          fi
