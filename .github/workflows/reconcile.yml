name: Reconcile Nomad jobs

# Self-hosted because GitHub-hosted runners cannot reach Nomad.
# Restarts are applied. The run is not detached: Nomad tracks the job
# until the deployment succeeds.

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      allow_resource_decrease:
        description: Jobs allowed to lower memory, memory_max, or CPU (comma-separated)
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  # Shared with patch-infra.yml so a host reboot cannot overlap a job run.
  group: homelab-cluster
  cancel-in-progress: false

env:
  NOMAD_ADDR: http://192.168.68.65:4646
  # The CLI appends Web UI hint lines to table output.
  NOMAD_CLI_SHOW_HINTS: "0"

jobs:
  reconcile:
    runs-on: [self-hosted, homelab]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The pushed range is read for Allow-Resource-Decrease lines.
          fetch-depth: 0

      # The file holds only the ci-reconcile secret (nomad_acl/policies/).
      # No file means ACLs are still off, so the run goes on without a token.
      - name: Load Nomad token
        run: |
          set -euo pipefail
          token_file="$HOME/.nomad/reconcile.token"
          if [[ ! -e "$token_file" ]]; then
            echo "::notice::no ${token_file}; running without a Nomad token"
            exit 0
          fi
          token="$(tr -d '[:space:]' <"$token_file")"
          if [[ ! "$token" =~ ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$ ]]; then
            echo "::error::${token_file} does not hold a Nomad token secret ID"
            exit 1
          fi
          echo "::add-mask::${token}"
          echo "NOMAD_TOKEN=${token}" >>"$GITHUB_ENV"
          echo "::notice::loaded Nomad token from ${token_file}"

      # Print registered images into the check. The Actions log store is blocked
      # from outside the LAN. A step keeps only its first ten notices, so this
      # is not the reconcile step.
      - name: Record registered jobs
        env:
          RECONCILE_STATUS: "1"
        run: scripts/reconcile-nomad.sh

      # The range is empty on a manual run and the input is empty on a push.
      # Passed through env so neither value becomes shell source.
      - name: Reconcile Nomad jobs
        env:
          RECONCILE_BEFORE: ${{ github.event.before }}
          RECONCILE_AFTER: ${{ github.event.after }}
          RECONCILE_ALLOW_DECREASE: ${{ inputs.allow_resource_decrease }}
        run: scripts/reconcile-nomad.sh
