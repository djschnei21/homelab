name: Confirm hosts after patch

# The patch job reboots the runner a minute after it exits. This check can be
# queued before that reboot. While a shutdown is still scheduled it queues the
# next attempt, so the attempt that runs after boot is the one that decides
# whether Nomad is ready. A GitHub-hosted runner cannot see the Pis.
# The patch job queues this only when the runner is the Nomad server host.
# Otherwise the playbook reboots the server in-band and the patch job's own
# readiness check is the post-boot check.

on:
  workflow_dispatch:
    inputs:
      attempt:
        description: Times this check has been requeued while a reboot is still scheduled
        required: false
        default: "0"

permissions:
  contents: read
  actions: write

concurrency:
  group: homelab-cluster
  cancel-in-progress: false

jobs:
  ready:
    runs-on: [self-hosted, homelab]
    env:
      NOMAD_ADDR: http://192.168.68.65:4646
      # The CLI appends Web UI hint lines to table output.
      NOMAD_CLI_SHOW_HINTS: "0"
      # Not a default Actions variable. set -u would abort the requeue.
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Passed as data. Interpolating the input into the script is shell on this runner.
      RECHECK_ATTEMPT: ${{ github.event.inputs.attempt || '0' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The file holds only the ci-patch secret (nomad_acl/policies/).
      # No file means ACLs are still off, so the check goes on without a token.
      - name: Load Nomad token
        run: |
          set -euo pipefail
          token_file="$HOME/.nomad/patch.token"
          if [[ ! -e "$token_file" ]]; then
            echo "::notice::no ${token_file}; running without a Nomad token"
            exit 0
          fi
          token="$(tr -d '[:space:]' <"$token_file")"
          if [[ ! "$token" =~ ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$ ]]; then
            echo "::error::${token_file} does not hold a Nomad token secret ID"
            exit 1
          fi
          echo "::add-mask::${token}"
          echo "NOMAD_TOKEN=${token}" >>"$GITHUB_ENV"
          echo "::notice::loaded Nomad token from ${token_file}"

      - name: Confirm Nomad nodes are ready
        run: |
          set -euo pipefail
          attempt="${RECHECK_ATTEMPT:-0}"
          if [[ ! "$attempt" =~ ^[0-9]+$ ]]; then
            echo "::error::bad recheck attempt"
            exit 1
          fi
          if [[ -f /run/systemd/shutdown/scheduled ]]; then
            if [[ "$attempt" -ge 8 ]]; then
              echo "::error::runner host reboot did not finish before the Nomad recheck gave up"
              exit 1
            fi
            next="$((attempt + 1))"
            echo "::notice::runner reboot is still scheduled; requeued Nomad recheck attempt ${next}"
            code="$(curl -sS --max-time 30 -o /tmp/homelab-dispatch-body -w '%{http_code}' -X POST \
              -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/patch-ready.yml/dispatches" \
              -d "{\"ref\":\"${GITHUB_REF_NAME}\",\"inputs\":{\"attempt\":\"${next}\"}}")"
            if [[ "$code" != "204" ]]; then
              echo "::error::recheck dispatch failed with HTTP ${code}"
              exit 1
            fi
            sleep 50
            exit 0
          fi
          # Clients rejoin for a while after the server boots. An empty node
          # list is not a healthy cluster; three clients must be listed and ready.
          if "${GITHUB_WORKSPACE}/scripts/nomad-nodes-ready.py" --min 3 --attempts 18 --delay 10 --timeout 15; then
            echo "::notice::all nomad nodes ready after patch"
          else
            echo "::error::a nomad node is not ready after patch"
            exit 1
          fi
