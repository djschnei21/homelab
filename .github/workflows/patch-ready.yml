name: Confirm hosts after patch

# The patch job reboots the runner a minute after it exits. This check can be
# queued before that reboot. While a shutdown is still scheduled it queues the
# next attempt, so the attempt that runs after boot is the one that decides
# whether Nomad is ready. A GitHub-hosted runner cannot see the Pis.

on:
  workflow_dispatch:
    inputs:
      attempt:
        description: Times this check has been requeued while a reboot is still scheduled
        required: false
        default: "0"

permissions:
  contents: read
  actions: write

concurrency:
  group: homelab-cluster
  cancel-in-progress: false

jobs:
  ready:
    runs-on: [self-hosted, homelab]
    env:
      NOMAD_ADDR: http://192.168.68.65:4646
    steps:
      - name: Confirm Nomad nodes are ready
        run: |
          set -euo pipefail
          attempt="${{ github.event.inputs.attempt || '0' }}"
          if [[ ! "$attempt" =~ ^[0-9]+$ ]]; then
            echo "::error::bad recheck attempt"
            exit 1
          fi
          if [[ -f /run/systemd/shutdown/scheduled ]]; then
            if [[ "$attempt" -ge 8 ]]; then
              echo "::error::runner host reboot did not finish before the Nomad recheck gave up"
              exit 1
            fi
            next="$((attempt + 1))"
            echo "::notice::runner reboot is still scheduled; requeued Nomad recheck attempt ${next}"
            code="$(curl -sS --max-time 30 -o /tmp/homelab-dispatch-body -w '%{http_code}' -X POST \
              -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/patch-ready.yml/dispatches" \
              -d "{\"ref\":\"${GITHUB_REF_NAME}\",\"inputs\":{\"attempt\":\"${next}\"}}")"
            if [[ "$code" != "204" ]]; then
              echo "::error::recheck dispatch failed with HTTP ${code}"
              exit 1
            fi
            sleep 50
            exit 0
          fi
          # Clients rejoin for a while after the server boots. A header with no
          # node rows is not a healthy cluster; pinode2-4 must be listed and ready.
          status_out="$(mktemp)"
          ready=0
          for _ in $(seq 1 18); do
            if timeout 15 nomad node status -no-color >"$status_out" 2>&1 \
              && awk 'NR>1 && NF { n++; if ($NF != "ready") bad = 1 } END { exit !(n >= 3 && !bad) }' "$status_out"; then
              ready=1
              break
            fi
            sleep 10
          done
          while IFS= read -r line; do
            [[ -z "$line" ]] && continue
            echo "::notice::${line}"
          done <"$status_out"
          rm -f "$status_out"
          if [[ "$ready" -eq 1 ]]; then
            echo "::notice::all nomad nodes ready after patch"
          else
            echo "::error::a nomad node is not ready after patch"
            exit 1
          fi
