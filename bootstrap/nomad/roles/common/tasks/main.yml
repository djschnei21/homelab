---
# ca-certificates: the key download and apt both reach HashiCorp over https.
- name: Install prerequisite packages
  apt:
    name:
      - ca-certificates
      - gpg
      - cgroup-tools
      - nfs-common
      - python3-debian
    state: present

- name: Refresh the HashiCorp apt signing key
  ansible.builtin.import_tasks: apt_keyring.yml
  vars:
    apt_keyring_url: "{{ hashicorp_apt_key_url }}"
    apt_keyring_path: "{{ hashicorp_apt_keyring }}"

- name: Remove legacy HashiCorp apt repository list
  ansible.builtin.file:
    path: /etc/apt/sources.list.d/hashicorp.list
    state: absent

- name: Add HashiCorp repository
  ansible.builtin.deb822_repository:
    name: hashicorp
    types:
      - deb
    uris:
      - https://apt.releases.hashicorp.com
    suites:
      - bookworm
    components:
      - main
    architectures:
      - arm64
    signed_by: "{{ hashicorp_apt_keyring }}"
    install_python_debian: true
    state: present

- name: Install Nomad
  apt:
    name: nomad
    state: present

- name: Enable Nomad
  service:
    name: nomad
    enabled: yes
