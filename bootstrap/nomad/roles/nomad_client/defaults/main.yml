---
docker_apt_key_url: https://download.docker.com/linux/debian/gpg
docker_apt_keyring: /usr/share/keyrings/docker-archive-keyring.gpg
# Primary keys the download may hold. Add a rotated key only after checking its
# fingerprint somewhere other than the download URL.
docker_apt_key_fingerprints:
  - 9DC858229FC7DD38854AE2D88D81803C0EBFCD88

# Seconds iscsid waits for a dropped session before failing SCSI I/O.
# Set to about twice the measured NAS reboot. The 120s package default
# turns a slow reboot into ext4 I/O errors.
iscsi_replacement_timeout: 600
